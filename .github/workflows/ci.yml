name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typecheck, lint, format check, build, and every test suite: core, daemon, CLI,
      # the CLI-daemon protocol e2e tests, and the client tests (happy-dom, no browser needed).
      - name: Check
        run: npm run check

      # Puppeteer downloads Chrome in its postinstall; installing it explicitly also covers npm
      # setups that skip install scripts. The harness adds `--no-sandbox` when `CI` is set.
      - name: Install Chrome for the browser tests
        run: npx puppeteer browsers install chrome

      # Real daemon + built client + headless Chrome (tests/browser), kept out of `npm test`.
      - name: Browser tests
        run: npm run test:browser
