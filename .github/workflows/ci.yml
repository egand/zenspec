name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typecheck, lint, format check, build, and every test suite: core, daemon, CLI,
      # the CLI-daemon protocol e2e tests, and the client tests (happy-dom, no browser needed).
      - name: Check
        run: npm run check
